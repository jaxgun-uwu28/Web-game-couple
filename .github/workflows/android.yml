name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ARCADE_APP_URL: ${{ vars.ARCADE_APP_URL }}
      ARCADE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run assets:generate && node scripts/generate-app-icons.mjs && node scripts/generate-android-art.mjs && node scripts/prepare-native.mjs && npx cap sync android
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
      - name: Restore release key (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcade-release.jks"; fi
      - name: Build debug APK
        run: chmod +x android/gradlew && android/gradlew -p android assembleDebug --no-daemon
      - name: Build signed release APK
        env:
          ARCADE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ARCADE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARCADE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f "$RUNNER_TEMP/arcade-release.jks" ]; then
            export ARCADE_KEYSTORE="$RUNNER_TEMP/arcade-release.jks"
            android/gradlew -p android assembleRelease --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: our-little-arcade-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
